name: Diag FTP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonde
        continue-on-error: true
        env: {S: "${{ secrets.FTP_SERVER }}", U: "${{ secrets.FTP_USERNAME }}", P: "${{ secrets.FTP_PASSWORD }}"}
        run: |
          python3 - << 'PY' > diag-output.txt 2>&1 || true
          import ftplib, os
          ftp=ftplib.FTP(os.environ['S'], timeout=40); ftp.login(os.environ['U'], os.environ['P'])
          base='/domains/mapairederunning.fr/public_html'
          out=[]; ftp.retrlines('LIST '+base, out.append)
          print("### DOCROOT listing (cherche .htaccess)")
          for l in out:
              if '.htaccess' in l or 'index.html' in l: print("  ",l)
          def chk(p):
              try:
                  b=[]; ftp.retrbinary('RETR '+p,b.append); d=b''.join(b).decode('utf-8','ignore'); return ('LINK' if 'linksynergy' in d else 'nolink', len(d))
              except Exception as e: return ('ERR',str(e)[:30])
          print("fiche Elite ->", chk(base+'/chaussures/kiprun-kipstorm-elite/index.html'))
          ftp.quit()
          PY
          echo __END__ >> diag-output.txt
      - name: Push
        if: always()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name d; git config user.email d@d
          git add -f diag-output.txt; git commit -m diag || echo none
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Tomrinrin/stride.git"
          git push origin HEAD:main || echo pushfail
