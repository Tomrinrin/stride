name: Diag FTP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonde FTP
        continue-on-error: true
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'PY' > diag-output.txt 2>&1 || true
          import ftplib, os
          ftp=ftplib.FTP(os.environ['S'], timeout=40); ftp.login(os.environ['U'], os.environ['P'])
          print("ROOT FTP =", ftp.pwd())
          def ls(p):
              out=[]
              try:
                  ftp.retrlines('LIST '+p, out.append); print("### LIST",p)
                  for l in out: print("   ",l)
              except Exception as e: print("### LIST",p,"ERR",e)
          for p in ['/','/public_html','/htdocs','/domains','/domains/mapairederunning.fr','/domains/mapairederunning.fr/public_html','/domains/mapairederunning.fr/private_html']:
              ls(p)
          def chk(path):
              try:
                  buf=[]; ftp.retrbinary('RETR '+path, buf.append); d=b''.join(buf).decode('utf-8','ignore')
                  return ('LINK' if 'linksynergy' in d else 'nolink', len(d))
              except Exception as e: return ('ERR',str(e)[:40])
          print("### index.html check")
          for path in ['/domains/mapairederunning.fr/public_html/chaussures/kiprun-kipstorm-elite/index.html','/domains/mapairederunning.fr/public_html/chaussures/hoka-speedgoat-7/index.html']:
              print("   ",path,"->",chk(path))
          ftp.quit()
          PY
          echo "__END__" >> diag-output.txt
      - name: Push result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "diag"; git config user.email "diag@local"
          git add -f diag-output.txt
          git commit -m "diag output" || echo nochange
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Tomrinrin/stride.git"
          git push origin HEAD:main || echo "push failed"

