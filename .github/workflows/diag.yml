name: Diag FTP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tous les liens
        continue-on-error: true
        run: |
          python3 - << 'PY' > diag-output.txt 2>&1 || true
          import json, subprocess
          d=json.load(open('src/data/shoes.json'))
          for s in d:
              u=s.get('affiliateUrl')
              if not u: continue
              try:
                  out=subprocess.run(['curl','-s','-o','/dev/null','-w','%{redirect_url}','-A','Mozilla/5.0',u],
                                     capture_output=True,text=True,timeout=30).stdout
                  final=out
                  # suivre 1 niveau de plus si besoin
                  if final and 'linksynergy' not in final:
                      kind='PRODUIT' if '/p/' in final else ('CATEGORIE' if ('/tous-les-sports/' in final or '/vc/' in final or '/browse/' in final) else '??')
                  else:
                      kind='?'
                  base=final.split('?')[0][:80]
                  print(f"{kind:9} | {s['id']:28} -> {base}")
              except Exception as e:
                  print("ERR", s['id'], str(e)[:40])
          PY
          echo __END__ >> diag-output.txt
      - name: Push
        if: always()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name d; git config user.email d@d
          git add -f diag-output.txt; git commit -m diag || echo none
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Tomrinrin/stride.git"
          git push origin HEAD:main || echo pushfail
