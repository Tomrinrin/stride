name: Fetch Photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharge photos
        continue-on-error: true
        run: |
          python3 - << 'PY' > photos-log.txt 2>&1
          import json, os, re, subprocess, urllib.parse
          d=json.load(open('src/data/shoes.json'))
          os.makedirs('public/images/chaussures', exist_ok=True)
          ok=0
          for s in d:
              aff=s.get('affiliateUrl')
              if not aff: continue
              page=urllib.parse.parse_qs(urllib.parse.urlparse(aff).query).get('murl',[None])[0]
              if not page: print("no murl",s['id']); continue
              try:
                  html=subprocess.run(['curl','-sL','-A','Mozilla/5.0',page],capture_output=True,text=True,timeout=45).stdout
                  m=re.search(r'https://contents\.mediadecathlon\.com/p\d+/[^"\'\s\\]+?\.jpg', html)
                  if not m: print("no img url",s['id'],"(html",len(html),"o)"); continue
                  img=m.group(0)+'?f=800x0'
                  dest='public/images/chaussures/'+s['id']+'.jpg'
                  subprocess.run(['curl','-sL','-A','Mozilla/5.0','-o',dest,img],timeout=45)
                  sz=os.path.getsize(dest) if os.path.exists(dest) else 0
                  if sz>3000:
                      s['image']='/images/chaussures/'+s['id']+'.jpg'; ok+=1; print("OK",s['id'],sz,"o")
                  else:
                      print("dl echoue",s['id'],sz,"o")
                      if os.path.exists(dest): os.remove(dest)
              except Exception as e: print("ERR",s['id'],str(e)[:50])
          json.dump(d,open('src/data/shoes.json','w'),ensure_ascii=False,indent=2)
          print("TOTAL:",ok)
          PY
          echo __END__ >> photos-log.txt
      - name: Commit
        if: always()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name photos; git config user.email p@p
          git add -f public/images/chaussures src/data/shoes.json photos-log.txt
          git commit -m "Photos Decathlon hebergees localement" || echo none
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Tomrinrin/stride.git"
          git push origin HEAD:main || echo pushfail
