name: Fetch Photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharge photos Decathlon et heberge localement
        run: |
          python3 - << 'PY'
          import json, os, re, subprocess, urllib.parse
          d=json.load(open('src/data/shoes.json'))
          os.makedirs('public/images/chaussures', exist_ok=True)
          def murl_of(aff):
              q=urllib.parse.urlparse(aff).query
              p=urllib.parse.parse_qs(q)
              return p.get('murl',[None])[0]
          ok=0
          for s in d:
              aff=s.get('affiliateUrl')
              if not aff: continue
              page=murl_of(aff)
              if not page: continue
              try:
                  html=subprocess.run(['curl','-sL','-A','Mozilla/5.0',page],capture_output=True,text=True,timeout=40).stdout
                  m=re.search(r'property=["\']og:image["\']\s+content=["\']([^"\']+)',html) or re.search(r'content=["\']([^"\']+)["\']\s+property=["\']og:image',html)
                  if not m:
                      print("no og:image", s['id']); continue
                  img=m.group(1).split('?')[0]+'?f=800x0'
                  dest='public/images/chaussures/'+s['id']+'.jpg'
                  r=subprocess.run(['curl','-sL','-A','Mozilla/5.0','-o',dest,img],timeout=40)
                  if os.path.getsize(dest)>3000:
                      s['image']='/images/chaussures/'+s['id']+'.jpg'; ok+=1; print("OK",s['id'],os.path.getsize(dest),"o")
                  else:
                      os.remove(dest); print("trop petit",s['id'])
              except Exception as e:
                  print("ERR",s['id'],str(e)[:40])
          json.dump(d,open('src/data/shoes.json','w'),ensure_ascii=False,indent=2)
          print("TOTAL photos hebergees:",ok)
          PY
      - name: Commit
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name photos; git config user.email p@p
          git add -f public/images/chaussures src/data/shoes.json
          git commit -m "Heberge les vraies photos Decathlon localement" || echo none
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Tomrinrin/stride.git"
          git push origin HEAD:main || echo pushfail
